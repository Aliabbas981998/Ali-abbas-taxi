<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>علي عباس - تكسي خاص</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .page {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: linear-gradient(145deg, #171717, #050505);
      border: 2px solid #d4af37;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(212,175,55,.25);
    }

    h1 {
      color: #d4af37;
      font-size: 38px;
      margin: 25px 10px 5px;
    }

    .taxi {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .phone {
      font-size: 24px;
      direction: ltr;
      margin: 15px;
      color: white;
    }

    .services {
      padding: 10px 20px;
      font-size: 21px;
      line-height: 2;
    }

    .whatsapp {
      display: block;
      margin: 25px 20px;
      padding: 17px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 23px;
      font-weight: bold;
    }

    .whatsapp:active {
      transform: scale(.98);
    }

    .footer {
      color: #d4af37;
      padding: 15px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <h1>علي عباس</h1>

      <div class="taxi">
        🚕 تكسي خاص
      </div>

      <div class="phone">
        +964 771 006 6513
      </div>

      <div class="services">
        🚗 تكسي خاص إلى جميع محافظات العراق<br>
        🗺️ المحافظات الشمالية والجنوبية<br>
        🕌 زيارة العتبات المقدسة<br>
        ⭐ خدمة مريحة وآمنة
      </div>

      <a
        class="whatsapp"
        href="https://wa.me/9647710066513"
        target="_blank">
        🟢 تواصل معي عبر واتساب
      </a>

      <div class="footer">
        للحجز والاستفسار اتصل أو راسلني عبر واتساب
      </div>

    </div>

  </div>

</body>
</html>
